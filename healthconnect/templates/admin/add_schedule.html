{% extends 'admin/base_admin.html' %}
{% load static %}

{% block title %}Add Schedule | HealthConnect Admin{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/add_schedule.css' %}">
{% endblock %}

{% block content %}

<h1 class="page-header">Add Schedule</h1>

<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        <label for="doctor_id">Doctor</label>

        <select id="doctor_id" name="doctor_id" required>

            <option value="">
                Select doctor
            </option>

            {% for doctor in doctors %}

            <option value="{{ doctor.id }}">
                {{ doctor.name }} — {{ doctor.specialization }}
            </option>

            {% endfor %}

        </select>

        <label for="date">Date</label>

        <input
            type="date"
            id="date"
            name="date"
            required
        >

        <label for="time">Time</label>

        <input
            type="time"
            id="time"
            name="time"
            required
        >

        <button type="submit">
            Add Schedule
        </button>

    </form>

</div>

{% endblock %}
