{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | HealthConnect</title>

    <link rel="stylesheet" href="{% static 'css/admin_login.css' %}">
</head>

<body>

<div class="admin-login-page">

    <div class="admin-login-card">

        <div class="logo">
            <span>Health</span>Connect
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Sign in to manage HealthConnect
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="admin@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login to Dashboard
            </button>

        </form>

        <a href="{% url 'home' %}" class="back-home">
            ← Back to HealthConnect
        </a>

    </div>

</div>

</body>
</html>
