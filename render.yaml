databases:
  - name: healthconnect-db
    databaseName: healthconnect
    user: healthconnect
    plan: free

services:
  - type: web
    name: healthconnect
    runtime: python
    plan: free
    rootDir: healthconnect
    buildCommand: bash build.sh
    startCommand: gunicorn healthconnect.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: ADMIN_EMAIL
        value: admin@healthconnect.com
      - key: ADMIN_PASSWORD
        generateValue: true
