{% if form.non_field_errors %}
  <div class="alert alert-error"><span>{{ form.non_field_errors|join:" " }}</span></div>
{% endif %}
{% for field in form %}
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="checkbox-row">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label></div>
    {{ field.errors }}
  {% else %}
    {% include "partials/field.html" with field=field %}
  {% endif %}
{% endfor %}
